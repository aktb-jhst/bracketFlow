services:
  - type: web
    name: bracketflow
    runtime: static
    buildCommand: ""
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*.html
        name: Cache-Control
        value: no-cache, max-age=0
      - path: /*.js
        name: Cache-Control
        value: no-cache, max-age=0
      - path: /*.css
        name: Cache-Control
        value: no-cache, max-age=0
